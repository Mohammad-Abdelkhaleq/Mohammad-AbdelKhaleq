<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Thanks for stopping by">
  <title>Thanks for stopping by!</title>
  <defs>
    <clipPath id="c3"><rect x="3" y="3" width="894" height="144" rx="26"/></clipPath>
    <style>
      .ink  { stroke:#1B1B1F; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .ink3 { stroke:#1B1B1F; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .toon { font-family:'Comic Sans MS','Chalkboard SE','Trebuchet MS','Segoe UI',sans-serif; }
      @keyframes roll { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
      @keyframes dash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-64px} }
      .w1 { animation: roll .9s linear infinite; transform-origin:-40px 0; }
      .w2 { animation: roll .9s linear infinite; transform-origin:-20px 0; }
      .w3 { animation: roll .9s linear infinite; transform-origin:18px 0; }
      .road { stroke-dasharray:26 18; animation: dash 10s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#c3)">
    <rect width="900" height="150" fill="#FFF6E5"/>
    <path d="M0 108 H900" stroke="#3A3F58" stroke-width="26"/>
    <path d="M0 108 H900" stroke="#FFD93D" stroke-width="4" class="road"/>

    <text x="450" y="40" class="toon" font-size="24" font-weight="bold" fill="#1B1B1F" text-anchor="middle">
      Thanks for stopping by! <tspan fill="#FF6B6B">★</tspan>
    </text>
    <text x="450" y="64" class="toon" font-size="15" fill="#2D3142" text-anchor="middle">
      Let's build something that doesn't collapse.
    </text>

    <g>
      <animateMotion dur="7s" repeatCount="indefinite" path="M-140 108 H1040"/>
      <rect x="-58" y="-34" width="58" height="34" rx="7" fill="#FF6B6B" class="ink3"/>
      <rect x="-2" y="-28" width="36" height="28" rx="9" fill="#4ECDC4" class="ink3"/>
      <rect x="10" y="-23" width="18" height="13" rx="4" fill="#EAF9FF" class="ink3"/>
      <rect x="32" y="-9" width="9" height="9" rx="3" fill="#FFD93D" class="ink3"/>
      <g class="w1"><circle cx="-40" cy="0" r="11" fill="#2D3142" class="ink3"/><path d="M-40 -7 v14" stroke="#FFF6E5" stroke-width="3"/></g>
      <g class="w2"><circle cx="-20" cy="0" r="11" fill="#2D3142" class="ink3"/><path d="M-20 -7 v14" stroke="#FFF6E5" stroke-width="3"/></g>
      <g class="w3"><circle cx="18" cy="0" r="11" fill="#2D3142" class="ink3"/><path d="M18 -7 v14" stroke="#FFF6E5" stroke-width="3"/></g>
    </g>
  </g>
  <rect x="3" y="3" width="894" height="144" rx="26" fill="none" stroke="#1B1B1F" stroke-width="6"/>
</svg>
