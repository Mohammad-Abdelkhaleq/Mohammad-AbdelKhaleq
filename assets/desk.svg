<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Cartoon developer at a desk">
  <title>Just another day at the keyboard</title>

  <defs>
    <clipPath id="c2"><rect x="3" y="3" width="894" height="274" rx="28"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3ECFF"/>
      <stop offset="100%" stop-color="#FFF6E5"/>
    </linearGradient>
    <style>
      .ink  { stroke:#1B1B1F; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .ink3 { stroke:#1B1B1F; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .toon { font-family:'Comic Sans MS','Chalkboard SE','Trebuchet MS','Segoe UI',sans-serif; }
      @keyframes tapL { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes tapR { 0%,100%{transform:translateY(-5px)} 50%{transform:translateY(0)} }
      @keyframes blinkc{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes puff  { 0%{opacity:0;transform:translateY(4px)} 35%{opacity:.95} 100%{opacity:0;transform:translateY(-10px)} }
      @keyframes zfloat{ 0%{opacity:0;transform:translate(0,0) scale(.7)} 40%{opacity:1} 100%{opacity:0;transform:translate(10px,-24px) scale(1.1)} }
      @keyframes wag   { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(10deg)} }
      @keyframes typel { 0%{width:0} 100%{width:104px} }
      .hL { animation: tapL .34s ease-in-out infinite; }
      .hR { animation: tapR .34s ease-in-out infinite; }
      .cur{ animation: blinkc 1.1s step-end infinite; }
      .st { animation: puff 3s ease-in-out infinite; }
      .st2{ animation: puff 3s ease-in-out infinite .9s; }
      .z1 { animation: zfloat 3s ease-in-out infinite; transform-origin:640px 150px; }
      .z2 { animation: zfloat 3s ease-in-out infinite 1.2s; transform-origin:652px 140px; }
      .tail{ animation: wag 2.4s ease-in-out infinite; transform-origin:672px 186px; }
      .ln1{ animation: typel 2.6s steps(14) infinite; }
      .ln2{ animation: typel 3.4s steps(14) infinite .4s; }
      .ln3{ animation: typel 3.0s steps(14) infinite .8s; }
    </style>
  </defs>

  <g clip-path="url(#c2)">
    <rect width="900" height="280" fill="url(#wall)"/>

    <g transform="rotate(-6 96 66)">
      <rect x="58" y="28" width="76" height="76" rx="6" fill="#FFD93D" class="ink3"/>
      <g stroke="#1B1B1F" stroke-width="3" stroke-linecap="round" opacity=".55">
        <path d="M70 50 h50 M70 64 h38 M70 78 h46"/>
      </g>
    </g>
    <g transform="rotate(5 176 78)">
      <rect x="146" y="46" width="62" height="62" rx="6" fill="#A8E6A1" class="ink3"/>
      <path d="M158 78 l10 12 22 -28" fill="none" stroke="#1B1B1F" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g>
      <circle cx="812" cy="66" r="34" fill="#FFF6E5" class="ink"/>
      <path d="M812 66 v-18 M812 66 l14 9" class="ink3"/>
      <circle cx="812" cy="66" r="4" fill="#FF6B6B"/>
    </g>

    <g>
      <rect x="246" y="52" width="212" height="136" rx="14" fill="#2D3142" class="ink"/>
      <rect x="258" y="64" width="188" height="100" rx="8" fill="#1B1B1F"/>
      <g>
        <rect class="ln1" x="272" y="80"  width="0" height="9" rx="4" fill="#FF6B6B"/>
        <rect class="ln2" x="272" y="100" width="0" height="9" rx="4" fill="#4ECDC4"/>
        <rect class="ln3" x="272" y="120" width="0" height="9" rx="4" fill="#FFD93D"/>
        <rect class="cur" x="272" y="140" width="10" height="10" rx="2" fill="#A8E6A1"/>
      </g>
      <path d="M330 188 l-10 22 h84 l-10 -22 z" fill="#3A3F58" class="ink"/>
      <rect x="300" y="206" width="104" height="10" rx="5" fill="#3A3F58" class="ink3"/>
    </g>

    <rect x="0" y="214" width="900" height="16" fill="#C9814B" class="ink"/>
    <rect x="0" y="230" width="900" height="50" fill="#A8663A"/>
    <path d="M0 230 H900" stroke="#1B1B1F" stroke-width="4"/>

    <g>
      <path d="M508 156 h84 a24 24 0 0 1 24 24 v40 h-132 v-40 a24 24 0 0 1 24 -24 z" fill="#4ECDC4" class="ink"/>
      <path d="M534 156 l16 18 16 -18" fill="none" class="ink3"/>

      <path d="M500 186 q-24 14 -26 30" fill="none" stroke="#1B1B1F" stroke-width="22" stroke-linecap="round"/>
      <path d="M500 186 q-24 14 -26 30" fill="none" stroke="#4ECDC4" stroke-width="14" stroke-linecap="round"/>
      <path d="M600 186 q24 14 26 30" fill="none" stroke="#1B1B1F" stroke-width="22" stroke-linecap="round"/>
      <path d="M600 186 q24 14 26 30" fill="none" stroke="#4ECDC4" stroke-width="14" stroke-linecap="round"/>

      <circle cx="550" cy="122" r="36" fill="#F5C6A0" class="ink"/>
      <circle cx="515" cy="126" r="8" fill="#F5C6A0" class="ink3"/>
      <circle cx="585" cy="126" r="8" fill="#F5C6A0" class="ink3"/>
      <g fill="#1B1B1F">
        <ellipse cx="538" cy="120" rx="5" ry="7"><animate attributeName="ry" values="7;7;7;7;1;7" dur="4.2s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="563" cy="120" rx="5" ry="7"><animate attributeName="ry" values="7;7;7;7;1;7" dur="4.2s" repeatCount="indefinite"/></ellipse>
      </g>
      <g fill="#FFFFFF"><circle cx="540" cy="118" r="1.8"/><circle cx="565" cy="118" r="1.8"/></g>
      <circle cx="526" cy="134" r="7" fill="#FF6B6B" opacity=".35"/>
      <circle cx="575" cy="134" r="7" fill="#FF6B6B" opacity=".35"/>
      <path d="M538 136 q12 12 25 0" fill="none" class="ink"/>

      <path d="M514 116 a36 36 0 0 1 72 0 q-13 -13 -29 -6 q-16 7 -43 6 z" fill="#3A2E2A" class="ink"/>
      <path d="M562 87 q12 -14 21 -3" fill="none" stroke="#3A2E2A" stroke-width="7" stroke-linecap="round"/>
      <path d="M511 124 a39 39 0 0 1 78 0" fill="none" stroke="#1B1B1F" stroke-width="14" stroke-linecap="round"/>
      <path d="M511 124 a39 39 0 0 1 78 0" fill="none" stroke="#6C5CE7" stroke-width="8" stroke-linecap="round"/>
      <rect x="498" y="112" width="24" height="34" rx="11" fill="#6C5CE7" class="ink"/>
      <rect x="578" y="112" width="24" height="34" rx="11" fill="#6C5CE7" class="ink"/>
    </g>

    <rect x="466" y="212" width="168" height="20" rx="7" fill="#E8ECF1" class="ink"/>
    <g stroke="#9AA5B1" stroke-width="3" stroke-linecap="round">
      <path d="M478 220 h16 M500 220 h16 M522 220 h16 M544 220 h16 M566 220 h16 M588 220 h16 M610 220 h12"/>
    </g>
    <g class="hL"><circle cx="474" cy="212" r="12" fill="#F5C6A0" class="ink3"/></g>
    <g class="hR"><circle cx="626" cy="212" r="12" fill="#F5C6A0" class="ink3"/></g>

    <g transform="translate(-186,0)">
      <g class="st" stroke="#C9BFAE" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M418 194 q-7 -9 0 -18 q7 -9 0 -16"/>
      </g>
      <g class="st2" stroke="#C9BFAE" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M436 194 q-7 -9 0 -18 q7 -9 0 -16"/>
      </g>
      <rect x="404" y="184" width="46" height="32" rx="8" fill="#FF6B6B" class="ink"/>
      <path d="M450 192 q16 10 0 18" fill="none" class="ink"/>
      <rect x="410" y="188" width="34" height="8" rx="4" fill="#6B4226" class="ink3"/>
    </g>

    <g>
      <g class="tail"><path d="M672 200 q28 6 20 -14" fill="none" stroke="#1B1B1F" stroke-width="13" stroke-linecap="round"/><path d="M672 200 q28 6 20 -14" fill="none" stroke="#FF9F43" stroke-width="7" stroke-linecap="round"/></g>
      <path d="M652 214 a34 22 0 0 1 68 0 z" fill="#FF9F43" class="ink"/>
      <circle cx="662" cy="192" r="17" fill="#FF9F43" class="ink"/>
      <path d="M650 182 l-2 -14 12 8 z" fill="#FF9F43" class="ink3"/>
      <path d="M674 182 l4 -13 -13 6 z" fill="#FF9F43" class="ink3"/>
      <path d="M654 192 q4 4 8 0 M666 192 q4 4 8 0" fill="none" class="ink3"/>
      <path d="M660 200 q3 3 6 0" fill="none" class="ink3"/>
      <g stroke="#1B1B1F" stroke-width="2" stroke-linecap="round"><path d="M646 198 h-10 M646 202 h-9 M678 198 h10 M678 202 h9"/></g>
      <text class="toon z1" x="636" y="152" font-size="17" font-weight="bold" fill="#6C5CE7">z</text>
      <text class="toon z2" x="650" y="142" font-size="14" font-weight="bold" fill="#6C5CE7">z</text>
    </g>

    <g>
      <path d="M790 190 q-16 -30 -34 -34 q8 26 26 34 z" fill="#A8E6A1" class="ink3"/>
      <path d="M798 190 q4 -34 22 -44 q4 30 -10 44 z" fill="#7CCB78" class="ink3"/>
      <path d="M804 192 q22 -18 40 -12 q-14 18 -34 20 z" fill="#A8E6A1" class="ink3"/>
      <path d="M776 190 h56 l-8 26 h-40 z" fill="#FF9F43" class="ink"/>
    </g>

    <g>
      <animateMotion dur="11s" repeatCount="indefinite" path="M-40 254 H940"/>
      <g stroke="#1B1B1F" stroke-width="3" stroke-linecap="round">
        <path d="M-8 6 l-8 6 M0 8 l0 8 M8 6 l8 6 M-9 -4 l-10 -2 M9 -4 l10 -2"/>
      </g>
      <ellipse cx="0" cy="0" rx="13" ry="10" fill="#FF6B6B" class="ink3"/>
      <path d="M0 -10 v20" stroke="#1B1B1F" stroke-width="3"/>
      <g fill="#1B1B1F"><circle cx="-6" cy="-3" r="2.5"/><circle cx="6" cy="2" r="2.5"/><circle cx="-5" cy="4" r="2"/></g>
      <path d="M-4 -10 q-4 -8 -9 -9 M4 -10 q4 -8 9 -9" fill="none" stroke="#1B1B1F" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g>
      <rect x="62" y="140" width="150" height="40" rx="20" fill="#FFF6E5" class="ink" transform="rotate(-3 137 160)"/>
      <text x="137" y="166" class="toon" font-size="15" font-weight="bold" fill="#1B1B1F" text-anchor="middle" transform="rotate(-3 137 160)">one more commit…</text>
    </g>
  </g>

  <rect x="3" y="3" width="894" height="274" rx="28" fill="none" stroke="#1B1B1F" stroke-width="6"/>
</svg>
