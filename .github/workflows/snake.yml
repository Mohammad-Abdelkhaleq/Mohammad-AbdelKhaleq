name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF6B6B&color_dots=#FFF6E5,#FFE08A,#FFD93D,#FF9F43,#FF6B6B
            dist/snake-dark.svg?palette=github-dark&color_snake=#4ECDC4&color_dots=#1B1B1F,#3A5A55,#4ECDC4,#7FE3DC,#A8E6A1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
